<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create a new account">
    <title>Sign Up | Auth Project</title>
    <link rel="icon" href="../fevicone_new_best.png" type="image/png">
    <link rel="stylesheet" href="../style.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        /* Signup OTP digit boxes — inline to avoid caching issues */
        #email-otp-digits,
        #phone-otp-digits {
            display: flex !important;
            flex-wrap: nowrap !important;
            gap: 0.5rem;
            justify-content: center;
            margin-bottom: 1.2rem;
        }

        #email-otp-digits .otp-digit,
        #phone-otp-digits .otp-digit {
            width: 46px !important;
            height: 54px !important;
            min-width: 46px;
            max-width: 46px;
            text-align: center;
            font-size: 1.4rem;
            font-weight: 700;
            font-family: inherit;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
            background: #1c1c1e;
            color: #ffffff;
            padding: 0;
            flex-shrink: 0;
            flex-grow: 0;
        }

        #email-otp-digits .otp-digit:focus,
        #phone-otp-digits .otp-digit:focus {
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.05);
        }

        #email-otp-digits .otp-digit.filled,
        #phone-otp-digits .otp-digit.filled {
            border-color: rgba(255, 255, 255, 0.3);
        }

        #email-otp-digits .otp-digit:disabled,
        #phone-otp-digits .otp-digit:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <!-- Aurora Background -->
    <div class="aurora-bg">
        <div class="aurora-glow"></div>
    </div>

    <div class="form-container">
        <!-- Close Button -->
        <a href="../index.html" class="close-btn" title="Close">&times;</a>

        <!-- Tab Toggle -->
        <div class="tab-toggle">
            <a href="#" class="active">Sign up</a>
            <a href="../signin/signin.html">Sign in</a>
        </div>

        <!-- Step 1: User Details -->
        <div id="step-1" class="form-step active">
            <h2>Create an account</h2>
            <p class="subtitle">Join us to get started.</p>
            <form id="signupForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Choose a unique username" required>
                </div>
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName" placeholder="Your full name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="phoneNumber">Phone Number</label>
                    <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="+91 9876543210" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Min 6 characters" minlength="6" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" minlength="6" required>
                </div>
                <p id="step1-error" class="error-msg"></p>
                <button type="submit" id="signupBtn" class="btn btn-primary btn-block">Continue</button>
            </form>

            <!-- Divider -->
            <div class="divider"><span>or</span></div>

            <!-- Google Sign Up Button -->
            <div id="g_id_onload"
                 data-client_id="680572175735-va61mifjbog3m6a61nb1lti41gp1frsn.apps.googleusercontent.com"
                 data-context="signup"
                 data-ux_mode="popup"
                 data-callback="handleGoogleCredentialResponse"
                 data-auto_prompt="false">
            </div>
            <div class="g_id_signin"
                 data-type="standard"
                 data-shape="rectangular"
                 data-theme="filled_black"
                 data-text="continue_with"
                 data-size="large"
                 data-logo_alignment="left"
                 data-width="350">
            </div>
        </div>

        <!-- Step 2: Dual OTP Verification -->
        <div id="step-2" class="form-step hidden">
            <h2>Verify Your Account</h2>
            <p class="subtitle">Enter the codes sent to your email and phone number.</p>

            <!-- Email OTP Card -->
            <div class="otp-verify-card" id="email-otp-card">
                <div class="otp-verify-card-header">
                    <div class="otp-verify-card-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                        </svg>
                    </div>
                    <div class="otp-verify-card-info">
                        <span class="otp-verify-card-title">Email Verification</span>
                        <span id="display-email" class="otp-verify-card-dest"></span>
                    </div>
                    <div id="email-verified-badge" class="verified-badge hidden">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                        Verified
                    </div>
                </div>
                <div class="otp-input-group" id="email-otp-digits">
                    <input type="text" class="otp-digit signup-otp-digit" maxlength="1" pattern="\d" inputmode="numeric" data-index="0">
                    <input type="text" class="otp-digit signup-otp-digit" maxlength="1" pattern="\d" inputmode="numeric" data-index="1">
                    <input type="text" class="otp-digit signup-otp-digit" maxlength="1" pattern="\d" inputmode="numeric" data-index="2">
                    <input type="text" class="otp-digit signup-otp-digit" maxlength="1" pattern="\d" inputmode="numeric" data-index="3">
                    <input type="text" class="otp-digit signup-otp-digit" maxlength="1" pattern="\d" inputmode="numeric" data-index="4">
                    <input type="text" class="otp-digit signup-otp-digit" maxlength="1" pattern="\d" inputmode="numeric" data-index="5">
                </div>
                <p id="email-otp-error" class="error-msg"></p>
                <button type="button" id="verifyEmailBtn" class="btn btn-primary btn-block btn-verify-otp">Verify Email</button>
            </div>

            <!-- Phone OTP Card -->
            <div class="otp-verify-card" id="phone-otp-card">
                <div class="otp-verify-card-header">
                    <div class="otp-verify-card-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/>
                        </svg>
                    </div>
                    <div class="otp-verify-card-info">
                        <span class="otp-verify-card-title">Phone Verification</span>
                        <span id="display-phone" class="otp-verify-card-dest"></span>
                    </div>
                    <div id="phone-verified-badge" class="verified-badge hidden">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                        Verified
                    </div>
                </div>
                <div class="otp-input-group" id="phone-otp-digits">
                    <input type="text" class="otp-digit signup-otp-digit" maxlength="1" pattern="\d" inputmode="numeric" data-index="0">
                    <input type="text" class="otp-digit signup-otp-digit" maxlength="1" pattern="\d" inputmode="numeric" data-index="1">
                    <input type="text" class="otp-digit signup-otp-digit" maxlength="1" pattern="\d" inputmode="numeric" data-index="2">
                    <input type="text" class="otp-digit signup-otp-digit" maxlength="1" pattern="\d" inputmode="numeric" data-index="3">
                    <input type="text" class="otp-digit signup-otp-digit" maxlength="1" pattern="\d" inputmode="numeric" data-index="4">
                    <input type="text" class="otp-digit signup-otp-digit" maxlength="1" pattern="\d" inputmode="numeric" data-index="5">
                </div>
                <p id="phone-otp-error" class="error-msg"></p>
                <button type="button" id="verifyPhoneBtn" class="btn btn-primary btn-block btn-verify-otp">Verify Phone</button>
            </div>

            <p id="step2-error" class="error-msg"></p>
            <button type="button" id="createAccountBtn" class="btn btn-primary btn-block" disabled>Create Account</button>
            <button type="button" id="backToStep1" class="btn btn-secondary btn-block mt-1">Back</button>
        </div>
    </div>

    <script>
        const signupForm = document.getElementById('signupForm');
        const step1 = document.getElementById('step-1');
        const step2 = document.getElementById('step-2');
        const step1Error = document.getElementById('step1-error');
        const step2Error = document.getElementById('step2-error');
        const signupBtn = document.getElementById('signupBtn');
        const verifyEmailBtn = document.getElementById('verifyEmailBtn');
        const verifyPhoneBtn = document.getElementById('verifyPhoneBtn');
        const createAccountBtn = document.getElementById('createAccountBtn');
        const emailOtpError = document.getElementById('email-otp-error');
        const phoneOtpError = document.getElementById('phone-otp-error');

        let userEmail = '';
        let isEmailVerified = false;
        let isPhoneVerified = false;

        // --- OTP Digit Input Handling (reusable for both groups) ---
        function setupOtpDigitGroup(containerId) {
            const container = document.getElementById(containerId);
            const digits = container.querySelectorAll('.otp-digit');

            digits.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    const value = e.target.value;
                    e.target.value = value.replace(/\D/g, '');
                    if (e.target.value && index < digits.length - 1) {
                        digits[index + 1].focus();
                    }
                    e.target.classList.toggle('filled', !!e.target.value);
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !input.value && index > 0) {
                        digits[index - 1].focus();
                        digits[index - 1].value = '';
                        digits[index - 1].classList.remove('filled');
                    }
                });

                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pasted = (e.clipboardData.getData('text') || '').replace(/\D/g, '');
                    for (let i = 0; i < digits.length; i++) {
                        digits[i].value = pasted[i] || '';
                        digits[i].classList.toggle('filled', !!digits[i].value);
                    }
                    const focusIndex = Math.min(pasted.length, digits.length - 1);
                    digits[focusIndex].focus();
                });
            });
        }

        function getDigitGroupValue(containerId) {
            const digits = document.getElementById(containerId).querySelectorAll('.otp-digit');
            return Array.from(digits).map(d => d.value).join('');
        }

        function clearDigitGroup(containerId) {
            const digits = document.getElementById(containerId).querySelectorAll('.otp-digit');
            digits.forEach(d => {
                d.value = '';
                d.classList.remove('filled');
                d.disabled = false;
            });
        }

        function disableDigitGroup(containerId) {
            const digits = document.getElementById(containerId).querySelectorAll('.otp-digit');
            digits.forEach(d => { d.disabled = true; });
        }

        // Initialize both OTP digit groups
        setupOtpDigitGroup('email-otp-digits');
        setupOtpDigitGroup('phone-otp-digits');

        function checkBothVerified() {
            if (isEmailVerified && isPhoneVerified) {
                createAccountBtn.disabled = false;
                createAccountBtn.classList.add('ready');
            }
        }

        // Step 1: Submit signup form
        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            step1Error.textContent = '';

            const username = document.getElementById('username').value.trim();
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phoneNumber = document.getElementById('phoneNumber').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                step1Error.textContent = 'Passwords do not match!';
                return;
            }
            if (password.length < 6) {
                step1Error.textContent = 'Password must be at least 6 characters.';
                return;
            }

            signupBtn.disabled = true;
            signupBtn.textContent = 'Sending codes...';

            try {
                const response = await fetch('/api/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, fullName, email, password, phoneNumber }),
                });
                const data = await response.json();

                if (!response.ok) {
                    step1Error.textContent = data.message;
                    signupBtn.disabled = false;
                    signupBtn.textContent = 'Continue';
                    return;
                }

                userEmail = email;
                document.getElementById('display-email').textContent = email;
                document.getElementById('display-phone').textContent = phoneNumber;

                step1.classList.remove('active');
                step1.classList.add('hidden');
                step2.classList.remove('hidden');
                step2.classList.add('active');

                // Focus the first email OTP digit
                document.getElementById('email-otp-digits').querySelector('.otp-digit').focus();
            } catch (err) {
                step1Error.textContent = 'Network error. Please try again.';
                signupBtn.disabled = false;
                signupBtn.textContent = 'Continue';
            }
        });

        // Verify Email OTP
        verifyEmailBtn.addEventListener('click', async () => {
            emailOtpError.textContent = '';
            const otp = getDigitGroupValue('email-otp-digits');

            if (!otp || otp.length !== 6) {
                emailOtpError.textContent = 'Please enter the 6-digit email code.';
                return;
            }

            verifyEmailBtn.disabled = true;
            verifyEmailBtn.textContent = 'Verifying...';

            try {
                const response = await fetch('/api/signup/verify-email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userEmail, otp }),
                });
                const data = await response.json();

                if (!response.ok) {
                    emailOtpError.textContent = data.message;
                    verifyEmailBtn.disabled = false;
                    verifyEmailBtn.textContent = 'Verify Email';
                    return;
                }

                isEmailVerified = true;
                document.getElementById('email-otp-card').classList.add('verified');
                document.getElementById('email-verified-badge').classList.remove('hidden');
                disableDigitGroup('email-otp-digits');
                verifyEmailBtn.disabled = true;
                verifyEmailBtn.textContent = '✓ Verified';
                verifyEmailBtn.classList.add('btn-verified');
                checkBothVerified();
            } catch (err) {
                emailOtpError.textContent = 'Network error. Please try again.';
                verifyEmailBtn.disabled = false;
                verifyEmailBtn.textContent = 'Verify Email';
            }
        });

        // Verify Phone OTP
        verifyPhoneBtn.addEventListener('click', async () => {
            phoneOtpError.textContent = '';
            const otp = getDigitGroupValue('phone-otp-digits');

            if (!otp || otp.length !== 6) {
                phoneOtpError.textContent = 'Please enter the 6-digit phone code.';
                return;
            }

            verifyPhoneBtn.disabled = true;
            verifyPhoneBtn.textContent = 'Verifying...';

            try {
                const response = await fetch('/api/signup/verify-phone', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userEmail, otp }),
                });
                const data = await response.json();

                if (!response.ok) {
                    phoneOtpError.textContent = data.message;
                    verifyPhoneBtn.disabled = false;
                    verifyPhoneBtn.textContent = 'Verify Phone';
                    return;
                }

                isPhoneVerified = true;
                document.getElementById('phone-otp-card').classList.add('verified');
                document.getElementById('phone-verified-badge').classList.remove('hidden');
                disableDigitGroup('phone-otp-digits');
                verifyPhoneBtn.disabled = true;
                verifyPhoneBtn.textContent = '✓ Verified';
                verifyPhoneBtn.classList.add('btn-verified');
                checkBothVerified();
            } catch (err) {
                phoneOtpError.textContent = 'Network error. Please try again.';
                verifyPhoneBtn.disabled = false;
                verifyPhoneBtn.textContent = 'Verify Phone';
            }
        });

        // Create Account (both verified)
        createAccountBtn.addEventListener('click', async () => {
            step2Error.textContent = '';
            createAccountBtn.disabled = true;
            createAccountBtn.textContent = 'Creating account...';

            try {
                const response = await fetch('/api/signup/complete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userEmail }),
                });
                const data = await response.json();

                if (!response.ok) {
                    step2Error.textContent = data.message;
                    createAccountBtn.disabled = false;
                    createAccountBtn.textContent = 'Create Account';
                    return;
                }

                localStorage.setItem('user', JSON.stringify({
                    username: data.user.username,
                    email: data.user.email,
                }));
                alert('Account created successfully! Welcome aboard.');
                window.location.href = '../landing.html';
            } catch (err) {
                step2Error.textContent = 'Network error. Please try again.';
                createAccountBtn.disabled = false;
                createAccountBtn.textContent = 'Create Account';
            }
        });

        // Back to Step 1
        document.getElementById('backToStep1').addEventListener('click', () => {
            step2.classList.remove('active');
            step2.classList.add('hidden');
            step1.classList.remove('hidden');
            step1.classList.add('active');
            signupBtn.disabled = false;
            signupBtn.textContent = 'Continue';
            isEmailVerified = false;
            isPhoneVerified = false;
            createAccountBtn.disabled = true;
            createAccountBtn.classList.remove('ready');
            clearDigitGroup('email-otp-digits');
            clearDigitGroup('phone-otp-digits');
            document.getElementById('email-verified-badge').classList.add('hidden');
            document.getElementById('phone-verified-badge').classList.add('hidden');
            document.getElementById('email-otp-card').classList.remove('verified');
            document.getElementById('phone-otp-card').classList.remove('verified');
            verifyEmailBtn.disabled = false;
            verifyEmailBtn.textContent = 'Verify Email';
            verifyEmailBtn.classList.remove('btn-verified');
            verifyPhoneBtn.disabled = false;
            verifyPhoneBtn.textContent = 'Verify Phone';
            verifyPhoneBtn.classList.remove('btn-verified');
            emailOtpError.textContent = '';
            phoneOtpError.textContent = '';
            step2Error.textContent = '';
        });
    </script>

    <!-- Google Auth Callback -->
    <script>
        async function handleGoogleCredentialResponse(response) {
            try {
                const res = await fetch('/api/auth/google', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ credential: response.credential }),
                });
                const data = await res.json();

                if (!res.ok) {
                    document.getElementById('step1-error').textContent = data.message || 'Google sign-up failed.';
                    return;
                }

                localStorage.setItem('user', JSON.stringify({
                    username: data.user.username,
                    email: data.user.email
                }));
                alert('Account created with Google! Welcome.');
                window.location.href = '../landing.html';
            } catch (err) {
                document.getElementById('step1-error').textContent = 'Network error during Google sign-up.';
            }
        }
    </script>
</body>
</html>
