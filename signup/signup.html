<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create a new account">
    <title>Sign Up | Auth Project</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <a href="../index.html" class="back-link">&larr; Back to Home</a>

    <div class="form-container">
        <!-- Step 1: User Details -->
        <div id="step-1" class="form-step active">
            <h2>Create Account</h2>
            <p class="subtitle">Join us to get started.</p>
            <form id="signupForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Choose a username" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Min 6 characters" minlength="6" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" minlength="6" required>
                </div>
                <p id="step1-error" class="error-msg"></p>
                <button type="submit" id="signupBtn" class="btn btn-primary btn-block">Continue</button>
            </form>
        </div>

        <!-- Step 2: OTP Verification -->
        <div id="step-2" class="form-step hidden">
            <h2>Verify Email</h2>
            <p class="subtitle">We sent a 6-digit code to <span id="display-email" class="highlight-email"></span></p>
            <form id="otpForm">
                <div class="form-group">
                    <label for="otp">Enter OTP</label>
                    <input type="text" id="otp" name="otp" maxlength="6" pattern="\d{6}" placeholder="123456" required>
                </div>
                <p id="step2-error" class="error-msg"></p>
                <button type="submit" id="verifyBtn" class="btn btn-primary btn-block">Verify & Create Account</button>
                <button type="button" id="backToStep1" class="btn btn-secondary btn-block mt-1">Back</button>
            </form>
        </div>
    </div>

    <script>
        const signupForm = document.getElementById('signupForm');
        const otpForm = document.getElementById('otpForm');
        const step1 = document.getElementById('step-1');
        const step2 = document.getElementById('step-2');
        const backToStep1Btn = document.getElementById('backToStep1');
        const step1Error = document.getElementById('step1-error');
        const step2Error = document.getElementById('step2-error');
        const signupBtn = document.getElementById('signupBtn');
        const verifyBtn = document.getElementById('verifyBtn');
        const displayEmail = document.getElementById('display-email');

        // Store the email from Step 1 so Step 2 can use it
        let userEmail = '';

        // ============================================
        // Step 1: Submit user details & request OTP
        // ============================================
        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            step1Error.textContent = '';

            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Client-side validation
            if (password !== confirmPassword) {
                step1Error.textContent = 'Passwords do not match!';
                return;
            }

            if (password.length < 6) {
                step1Error.textContent = 'Password must be at least 6 characters.';
                return;
            }

            // Disable button to prevent double-clicks
            signupBtn.disabled = true;
            signupBtn.textContent = 'Sending OTP...';

            try {
                const response = await fetch('/api/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password }),
                });

                const data = await response.json();

                if (!response.ok) {
                    step1Error.textContent = data.message || 'Something went wrong.';
                    signupBtn.disabled = false;
                    signupBtn.textContent = 'Continue';
                    return;
                }

                // Success! Save email and switch to Step 2
                userEmail = email;
                displayEmail.textContent = email;

                step1.classList.remove('active');
                step1.classList.add('hidden');
                step2.classList.remove('hidden');
                step2.classList.add('active');
            } catch (err) {
                step1Error.textContent = 'Network error. Please try again.';
                signupBtn.disabled = false;
                signupBtn.textContent = 'Continue';
            }
        });

        // ============================================
        // Step 2: Verify OTP
        // ============================================
        otpForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            step2Error.textContent = '';

            const otp = document.getElementById('otp').value.trim();

            // Disable button
            verifyBtn.disabled = true;
            verifyBtn.textContent = 'Verifying...';

            try {
                const response = await fetch('/api/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userEmail, otp }),
                });

                const data = await response.json();

                if (!response.ok) {
                    step2Error.textContent = data.message || 'Verification failed.';
                    verifyBtn.disabled = false;
                    verifyBtn.textContent = 'Verify & Create Account';
                    return;
                }

                // Success!
                alert('Account Verified! Your account has been created successfully.');
                window.location.href = '../signin/signin.html';
            } catch (err) {
                step2Error.textContent = 'Network error. Please try again.';
                verifyBtn.disabled = false;
                verifyBtn.textContent = 'Verify & Create Account';
            }
        });

        // ============================================
        // Back Button: Return to Step 1
        // ============================================
        backToStep1Btn.addEventListener('click', () => {
            step2.classList.remove('active');
            step2.classList.add('hidden');
            step1.classList.remove('hidden');
            step1.classList.add('active');
            signupBtn.disabled = false;
            signupBtn.textContent = 'Continue';
        });
    </script>
</body>
</html>
