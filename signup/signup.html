<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create a new account">
    <title>Sign Up | Auth Project</title>
    <link rel="stylesheet" href="../style.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <!-- Aurora Background -->
    <div class="aurora-bg">
        <div class="aurora-glow"></div>
    </div>

    <div class="form-container">
        <!-- Close Button -->
        <a href="../index.html" class="close-btn" title="Close">&times;</a>

        <!-- Tab Toggle -->
        <div class="tab-toggle">
            <a href="#" class="active">Sign up</a>
            <a href="../signin/signin.html">Sign in</a>
        </div>

        <!-- Step 1: User Details -->
        <div id="step-1" class="form-step active">
            <h2>Create an account</h2>
            <p class="subtitle">Join us to get started.</p>
            <form id="signupForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Choose a unique username" required>
                </div>
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName" placeholder="Your full name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Min 6 characters" minlength="6" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" minlength="6" required>
                </div>
                <p id="step1-error" class="error-msg"></p>
                <button type="submit" id="signupBtn" class="btn btn-primary btn-block">Create an account</button>
            </form>

            <!-- Divider -->
            <div class="divider"><span>or</span></div>

            <!-- Google Sign Up Button -->
            <div id="g_id_onload"
                 data-client_id="680572175735-va61mifjbog3m6a61nb1lti41gp1frsn.apps.googleusercontent.com"
                 data-context="signup"
                 data-ux_mode="popup"
                 data-callback="handleGoogleCredentialResponse"
                 data-auto_prompt="false">
            </div>
            <div class="g_id_signin"
                 data-type="standard"
                 data-shape="rectangular"
                 data-theme="filled_black"
                 data-text="continue_with"
                 data-size="large"
                 data-logo_alignment="left"
                 data-width="350">
            </div>
        </div>

        <!-- Step 2: OTP Verification -->
        <div id="step-2" class="form-step hidden">
            <h2>Verify Email</h2>
            <p class="subtitle">We sent a 6-digit code to <span id="display-email" class="highlight-email"></span></p>
            <form id="otpForm">
                <div class="form-group">
                    <label for="otp">Enter OTP</label>
                    <input type="text" id="otp" name="otp" maxlength="6" pattern="\d{6}" placeholder="123456" required>
                </div>
                <p id="step2-error" class="error-msg"></p>
                <button type="submit" id="verifyBtn" class="btn btn-primary btn-block">Verify & Create Account</button>
                <button type="button" id="backToStep1" class="btn btn-secondary btn-block mt-1">Back</button>
            </form>
        </div>
    </div>

    <script>
        const signupForm = document.getElementById('signupForm');
        const otpForm = document.getElementById('otpForm');
        const step1 = document.getElementById('step-1');
        const step2 = document.getElementById('step-2');
        const step1Error = document.getElementById('step1-error');
        const step2Error = document.getElementById('step2-error');
        const signupBtn = document.getElementById('signupBtn');
        const verifyBtn = document.getElementById('verifyBtn');
        const displayEmail = document.getElementById('display-email');
        let userEmail = '';

        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            step1Error.textContent = '';

            const username = document.getElementById('username').value.trim();
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                step1Error.textContent = 'Passwords do not match!';
                return;
            }
            if (password.length < 6) {
                step1Error.textContent = 'Password must be at least 6 characters.';
                return;
            }

            signupBtn.disabled = true;
            signupBtn.textContent = 'Sending OTP...';

            try {
                const response = await fetch('/api/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, fullName, email, password }),
                });
                const data = await response.json();

                if (!response.ok) {
                    step1Error.textContent = data.message;
                    signupBtn.disabled = false;
                    signupBtn.textContent = 'Create an account';
                    return;
                }

                userEmail = email;
                displayEmail.textContent = email;
                step1.classList.remove('active');
                step1.classList.add('hidden');
                step2.classList.remove('hidden');
                step2.classList.add('active');
            } catch (err) {
                step1Error.textContent = 'Network error. Please try again.';
                signupBtn.disabled = false;
                signupBtn.textContent = 'Create an account';
            }
        });

        otpForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            step2Error.textContent = '';
            const otp = document.getElementById('otp').value.trim();

            verifyBtn.disabled = true;
            verifyBtn.textContent = 'Verifying...';

            try {
                const response = await fetch('/api/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userEmail, otp }),
                });
                const data = await response.json();

                if (!response.ok) {
                    step2Error.textContent = data.message;
                    verifyBtn.disabled = false;
                    verifyBtn.textContent = 'Verify & Create Account';
                    return;
                }

                alert('Account Verified! Your account has been created successfully.');
                localStorage.setItem('user', JSON.stringify({
                    username: document.getElementById('username').value.trim(),
                    email: userEmail
                }));
                window.location.href = '../landing.html';
            } catch (err) {
                step2Error.textContent = 'Network error. Please try again.';
                verifyBtn.disabled = false;
                verifyBtn.textContent = 'Verify & Create Account';
            }
        });

        document.getElementById('backToStep1').addEventListener('click', () => {
            step2.classList.remove('active');
            step2.classList.add('hidden');
            step1.classList.remove('hidden');
            step1.classList.add('active');
            signupBtn.disabled = false;
            signupBtn.textContent = 'Create an account';
        });
    </script>

    <!-- Google Auth Callback -->
    <script>
        async function handleGoogleCredentialResponse(response) {
            try {
                const res = await fetch('/api/auth/google', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ credential: response.credential }),
                });
                const data = await res.json();

                if (!res.ok) {
                    document.getElementById('step1-error').textContent = data.message || 'Google sign-up failed.';
                    return;
                }

                localStorage.setItem('user', JSON.stringify({
                    username: data.user.username,
                    email: data.user.email
                }));
                alert('Account created with Google! Welcome.');
                window.location.href = '../landing.html';
            } catch (err) {
                document.getElementById('step1-error').textContent = 'Network error during Google sign-up.';
            }
        }
    </script>
</body>
</html>
